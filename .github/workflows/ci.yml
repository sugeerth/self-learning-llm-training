name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fast, deterministic checks on every push/PR. The LIVE eval-gate (a real arms
# campaign, which trains models and takes ~an hour) runs on a schedule instead —
# see eval-gate.yml. The unit tests here already cover the objective's scoring
# and its comparability invariants (tests/test_objective.py), so a regression in
# the gate logic itself is caught per-PR without training anything.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps (torch CPU for the arms-logic tests)
        run: |
          pip install numpy pytest tiktoken
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest tests/ -q
