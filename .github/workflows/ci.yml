name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps (torch CPU for the arms-logic tests)
        run: |
          pip install numpy pytest tiktoken
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest tests/ -q

  # ── Eval gate ──────────────────────────────────────────────────────────
  # The self-learning objective (regret vs random) is a REGRESSION GUARD, not a
  # leaderboard. It fails the build if a change makes the search no better than
  # random or breaks the comparability invariants (non-deterministic eval,
  # missing baseline, mismatched seeds/vocab) — e.g. the arms vocab-clamp bug.
  # A small budget keeps it fast; the floor is lenient so only real breakage,
  # not seed noise, turns the build red. Tighten --min-speedup as the search
  # genuinely improves.
  objective-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install numpy tiktoken
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run self-learning objective gate
        run: |
          python -m self_learning_objective gate \
            --run --seeds 3 --budget 160 --full-steps 32 \
            --min-speedup 0.6
