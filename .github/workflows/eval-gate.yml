name: Eval Gate (self-learning objective)

# The live regression guard. It runs a real head-to-head arms campaign and fails
# if the search is no longer measurably better than random search, or if the
# comparability invariants break (non-deterministic eval, missing baseline,
# mismatched seeds/vocab — e.g. the arms vocab-clamp bug). Because it trains
# models, it is scheduled rather than run on every PR.
#
#   J = (steps random needs to reach quality Q) / (steps the learner needs)
#
# The floor is a lenient regression guard, not a leaderboard: only a real
# regression (J below the floor) or broken invariants turn it red. Tighten
# --min-speedup as the search genuinely improves. Observed baseline: J~=2.0 at
# budget=160, seeds=3 (best learner = prior).
on:
  schedule:
    - cron: "0 6 * * *"      # nightly at 06:00 UTC
  workflow_dispatch:
    inputs:
      seeds:
        description: "seeds per arm"
        default: "3"
      budget:
        description: "step budget per arm/seed"
        default: "160"
      min_speedup:
        description: "floor on J (fail below this)"
        default: "0.6"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install numpy tiktoken
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run self-learning objective gate
        run: |
          python -m self_learning_objective gate --run \
            --seeds "${{ github.event.inputs.seeds || '3' }}" \
            --budget "${{ github.event.inputs.budget || '160' }}" \
            --full-steps 32 \
            --min-speedup "${{ github.event.inputs.min_speedup || '0.6' }}"
      - name: Upload arms report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arms-report
          path: |
            arms_report.json
            arms_report.html
          if-no-files-found: ignore
